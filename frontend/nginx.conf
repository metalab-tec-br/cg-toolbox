# ════════════════════════════════════════════════════════════════════════
# CG Toolbox — frontend (nginx) config
#
# Serves the static app (index.html, css/, js/, img/) and reverse-proxies
# /api/* to the backend container (cg-toolbox-backend:3000) — the browser
# only ever talks to THIS container; cg-toolbox-backend and cg-toolbox-db
# have no published ports (see docker-compose.yml).
#
# NOTE on NTLM: the NTLM challenge/response handshake needs to happen over
# the SAME TCP connection from browser -> nginx -> backend. The "keepalive"
# upstream setting + proxy_http_version 1.1 below help, but NTLM through a
# reverse proxy is known to be fragile (behavior varies by nginx/client
# version) — this was NOT an issue before the 3-container split, since the
# Node backend used to serve the frontend directly (no proxy hop at all). If
# you see repeated login prompts or 401 loops after this change, either set
# NTLM_DISABLED=1 on cg-toolbox-backend (falls back to the x-dev-user header
# or the container's OS user) or rely on API keys for programmatic access
# instead of NTLM.
# ════════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20m; # linhas de comando com imagem em base64 (ver server/index.js, express.json 15mb)

  upstream cg_toolbox_backend {
    server cg-toolbox-backend:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://cg_toolbox_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── HTTPS (opcional) ──
  # Para terminar TLS de verdade aqui, monte um certificado no container
  # (ex.: volume "./tls:/etc/nginx/tls:ro" no docker-compose.yml) e adicione:
  #
  # server {
  #   listen 443 ssl;
  #   server_name _;
  #   ssl_certificate     /etc/nginx/tls/cert.pem;
  #   ssl_certificate_key /etc/nginx/tls/key.pem;
  #   root /usr/share/nginx/html;
  #   index index.html;
  #   location / { try_files $uri $uri/ /index.html; }
  #   location /api/ {
  #     proxy_pass http://cg_toolbox_backend/api/;
  #     proxy_http_version 1.1;
  #     proxy_set_header Connection "";
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  # }
}
