services:
  cg-toolbox:
    build:
      context: .
      # "network: host" faz o build usar a rede do próprio host em vez da
      # bridge padrão do Docker — em alguns servidores/VPNs a bridge do
      # Docker tem um MTU incompatível com a rede real, e etapas do build
      # que baixam pacotes (apt-get update/install da imagem "deps", ver
      # Dockerfile) travam com "Connection timed out" mesmo com internet
      # funcionando normalmente no host. Com host network, o build usa a
      # mesma interface/MTU que o "curl"/"apt" do host já usam sem problema.
      network: host
    image: cg-toolbox:latest
    restart: unless-stopped
    ports:
      # Host:container — o container escuta em 3000 (não-root não pode abrir
      # <1024, ver Dockerfile); "80" aqui é só o mapeamento do host, então o
      # app fica acessível em http://<ip-do-servidor> (sem porta na URL) do
      # mesmo jeito que a instalação bare-metal (install-cgtoolbox.sh).
      - "80:3000"
      # Descomente se quiser acessar também direto pela porta 3000 (além da 80):
      # - "3000:3000"
      #
      # --- HTTPS de verdade dentro do container (opcional) ---
      # 1) Gere/obtenha um certificado e monte-o em /app/tls (ex.: volume ou
      #    bind mount para /etc/cg-toolbox/tls do host);
      # 2) Descomente a porta abaixo e as variáveis TLS_CERT_PATH/TLS_KEY_PATH
      #    e HTTPS_PORT no bloco "environment";
      # 3) "443:3443" mapeia a porta 443 do host pra 3443 do container (porta
      #    alta — não precisa de root/capability dentro do container).
      # - "443:3443"
    environment:
      PORT: "3000"
      # Ver comentário no Dockerfile — mantém as duas portas iguais por
      # padrão (só HTTP, sem tentar abrir 443 dentro do container). Para
      # habilitar HTTPS de verdade, descomente as 3 linhas abaixo (e a porta
      # "443:3443" acima):
      # HTTPS_PORT: "3443"
      # TLS_CERT_PATH: "/app/tls/cert.pem"
      # TLS_KEY_PATH: "/app/tls/key.pem"
      #
      # Descomente se este host não estiver num domínio Windows — sem NTLM,
      # os usuários são identificados por um header x-dev-user (ou caem no
      # usuário do sistema operacional rodando o Node dentro do container,
      # ex.: "node"), o que quebra favoritos por pessoa.
      # NTLM_DISABLED: "1"
      #
      # Botão "Check for updates"/"Update now" (Settings → System) — fala
      # com o serviço "updater" abaixo pela rede interna do compose (nome do
      # serviço = hostname). UPDATER_TOKEN é opcional: só faz sentido setar
      # se este compose alguma vez publicar a porta do updater ou rodar numa
      # rede compartilhada com outros containers não confiáveis; deixando em
      # branco (padrão), a proteção já vem de o updater não ter porta
      # publicada pro host (ver serviço "updater" abaixo).
      UPDATER_URL: "http://updater:8080"
      UPDATER_TOKEN: "${UPDATER_TOKEN:-}"
    volumes:
      # Banco de dados (commands.db) num volume nomeado, fora da imagem —
      # sobrevive a "docker compose down"/rebuild da imagem. Numa instalação
      # nova, o volume começa vazio e o servidor cria um commands.db novo
      # (schema aplicado, sem dados) no primeiro boot — ver server/db.js.
      # Para trazer um catálogo já existente, copie o arquivo .db para dentro
      # do volume antes do primeiro "docker compose up" (ver
      # install-instructions.txt, seção Docker).
      - cg-toolbox-data:/app/data
      # Descomente junto com o bloco de HTTPS acima, apontando para a pasta
      # com cert.pem/key.pem no host:
      # - /etc/cg-toolbox/tls:/app/tls:ro

  # ── UPDATER (companion) ──
  # Único motivo de existir: dar ao botão "Check for updates"/"Update now"
  # acesso a git + docker CLI SEM dar esse acesso ao container público
  # cg-toolbox (ver updater/server.js e updater/Dockerfile para o racional
  # de segurança completo). Isolado de propósito:
  #   - SEM "ports:" — não é alcançável de fora do host, só pelo cg-toolbox
  #     via rede interna do compose (DNS "updater", porta 8080);
  #   - só sabe fazer duas coisas fixas (checar/aplicar update) — não recebe
  #     nenhum comando arbitrário do chamador;
  #   - roda com o socket do Docker do host montado, então tecnicamente tem
  #     controle total do Docker do host — é o trade-off aceito para ter
  #     "1 clique" de update sem dar esse mesmo acesso ao container exposto.
  # Se preferir não correr nem esse risco, comente/remova este serviço e as
  # 2 linhas UPDATER_* acima — o botão passa a mostrar "not available" e a
  # atualização volta a ser 100% manual (git pull + docker compose up -d
  # --build, ver comando no próprio README/install-instructions.txt).
  updater:
    build:
      context: ./updater
      # Mesmo motivo do serviço cg-toolbox acima: o build baixa pacotes via
      # apt e um binário via curl (plugin docker compose), e a bridge padrão
      # do Docker pode ter MTU incompatível com a rede real do host em
      # alguns ambientes.
      network: host
    image: cg-toolbox-updater:latest
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: "${UPDATER_TOKEN:-}"
    volumes:
      # Socket do Docker do host — é isto que dá ao "docker compose" rodado
      # DENTRO deste container poder de gerenciar containers do HOST.
      - /var/run/docker.sock:/var/run/docker.sock
      # O repositório inteiro (bind mount, não volume nomeado) — "git pull"
      # aqui dentro escreve direto nos arquivos do host, e "docker compose
      # up --build" usa este mesmo diretório como contexto de build.
      - .:/repo

volumes:
  cg-toolbox-data:
